# Provider list prices, USD per 1,000,000 tokens, as read from the providers' own pricing pages on
# the date below. The `cost-estimate` skill refreshes this file from the live pages before any paid
# run; scripts/cost_dashboard.py reads it. Real spend is always checked against the DeepSeek
# balance endpoint afterwards -- list price is a projection, the dashboard delta is the fact.
as_of: 2026-09-07

deepseek:
  source: https://api-docs.deepseek.com/quick_start/pricing
  # "Off-peak rates are half of the peak rates. Peak hours are 01:00 - 04:00 and 06:00 - 10:00 UTC,
  # Monday through Friday (all other hours are off-peak)."
  peak_windows_utc:
    - {days: "Mon-Fri", from: "01:00", to: "04:00"}
    - {days: "Mon-Fri", from: "06:00", to: "10:00"}
  balance_endpoint: https://api.deepseek.com/user/balance
  models:
    deepseek-v4-flash:
      context: 1M
      max_output: 384K
      off_peak: {input_cache_hit: 0.007, input_cache_miss: 0.22, output: 0.66}
      peak:     {input_cache_hit: 0.014, input_cache_miss: 0.44, output: 1.32}
    deepseek-v4-pro:
      context: 1M
      max_output: 384K
      off_peak: {input_cache_hit: 0.022, input_cache_miss: 0.66, output: 1.98}
      peak:     {input_cache_hit: 0.044, input_cache_miss: 1.32, output: 3.96}

zai:
  source: https://docs.z.ai/guides/overview/pricing
  # No off-peak pricing is published. A 50% launch promotion "ends at 24:00 on September 9, 2026
  # (UTC+8, Singapore time)". Cached-input storage: "Limited-time Free".
  models:
    glm-5.3-flash:
      list:  {input_cache_hit: 0.03,  input_cache_miss: 0.15,  output: 0.50}
      promo: {input_cache_hit: 0.015, input_cache_miss: 0.075, output: 0.25, ends: "2026-09-09T16:00:00Z"}
    glm-5.3:
      list:  {input_cache_hit: 0.26,  input_cache_miss: 1.4,   output: 4.4}
