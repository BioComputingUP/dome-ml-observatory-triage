# KeyBERT extraction config for src/dome_triage/keywords/keybert_extract.py

model_name: all-MiniLM-L6-v2   # small (~90MB), CPU-feasible per spec -- smoke-test after Docker build
keyphrase_ngram_range: [1, 3]
use_mmr: true
diversity: 0.5
top_n: 15

# Run per-positive-document, then aggregate into a corpus-level doc-frequency ranking.
aggregate_by: document_frequency
