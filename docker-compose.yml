# Two services (AGENTS.md rules 8-9):
#   pipeline -- the validated `dome-triage` CLI (classification on DeepSeek, enrichment on the EBI
#               gateway). Never connects to the database.
#   tools    -- every other script: moros_pipeline / mongo_landscape_export / schema scripts and
#               their test suites, the input builders, the live status view, the checkpoint pusher.
#               Never imports dome_triage.
#
#   docker compose build
#   docker compose run --rm pipeline dome-triage llm-classify --help
#   docker compose run --rm pipeline pytest --ignore=tests/test_curate_page.py
#   docker compose run --rm tools bash -c 'cd moros_pipeline/scripts && python -m pytest -q .'
services:
  pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    command: ["bash"]
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      # So provenance.py's git-commit lookup works inside the container too.
      - ./.git:/app/.git:ro
      # CRITERIA.md and the three vocabulary JSONs are read at runtime by
      # llm_classify/prompts.py and llm_classify/enrichment.py. Read-only: nothing in the
      # pipeline ever writes here.
      - ./curation_criteria:/app/curation_criteria:ro
      # The rendered prompts and PROMPT_HASHES.json: the e2/e3 tests compare the live render with
      # the committed file. Read-only.
      - ./prompts:/app/prompts:ro
      # Read-WRITE: a classify run reads its staged CSV from here (written on the host by
      # build_incoming_documents.py) and writes its event log back here via --events-out; an
      # enrichment run reads its export (export_journal_for_enrichment.py) and writes its events
      # here the same way. Keeping every batch's events beside its input is what keeps identifier
      # spaces from being conflated in one log.
      - ./moros_pipeline:/app/moros_pipeline
    working_dir: /app
    tty: true
    stdin_open: true
    environment:
      # Substituted by Compose from the repo-root .env (gitignored). See .env.example.
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # Enrichment prompt e2 (GLM-5.3 on Z.ai's pay-as-you-go API). Optional: only `enrich --prompt e2` reads it.
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      # Production enrichment (the latest prompt) on the EMBL-EBI LiteLLM gateway. See .env.example.
      - EBI_LLM_BASE_URL=${EBI_LLM_BASE_URL:-}
      - EBI_LLM_API_KEY=${EBI_LLM_API_KEY:-}
      - EBI_LLM_MODEL=${EBI_LLM_MODEL:-}
      - EBI_LLM_MAX_CONCURRENCY=${EBI_LLM_MAX_CONCURRENCY:-}
      - NCBI_API_KEY=${NCBI_API_KEY:-}
      - CROSSREF_MAILTO=${CROSSREF_MAILTO:-}
      # Python block-buffers stdout when it is not a TTY; a redirected or backgrounded run would
      # otherwise die with an empty log. Unbuffered means every run is diagnosable.
      - PYTHONUNBUFFERED=1
    # Hard memory ceiling so a bug in a long run is contained to this container, not the host.
    mem_limit: 12g

  tools:
    build:
      context: .
      dockerfile: docker/Dockerfile.tools
    # The repository's PARENT is mounted, so the sibling folders the scripts expect beside this one
    # (the runs repository, the Zenodo dump, the test bed, dome-ml-observatory) resolve exactly as
    # on the host, and a missing sibling is simply absent rather than created root-owned.
    volumes:
      - ..:/workspace
    working_dir: /workspace/${TRIAGE_DIR:-dome-ml-observatory-triage}
    # Files it writes belong to you, not root. Export HOST_UID/HOST_GID if yours are not 1000
    # (scripts/run_enrichment.sh does it for you).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    tty: true
    stdin_open: true
    environment:
      # For scripts/checkpoint_events.py only: a GitHub token, passed per run as
      # GH_TOKEN=$(gh auth token). Never written to .env.
      - GH_TOKEN=${GH_TOKEN:-}
    mem_limit: 8g
